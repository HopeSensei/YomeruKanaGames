<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>よめるかな？ Hiragana Word Reader</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF4F0;--ink:#1D2E3B;--soft:#5B6F7C;--panel:#FFFFFF;--line:#D9776B;--btn:#DDE8E2;--btnh:#CBDCD3;--ok:#2E8B57;--okbg:#D5EEDD;--bad:#C0392B;--badbg:#F8DAD5;--acc:#2F4B7C;--accfg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201E;--ink:#E7F0EC;--soft:#9DB2AB;--panel:#1D2E2B;--line:#E58B7E;--btn:#2A3F3B;--btnh:#35504A;--ok:#7BD39B;--okbg:#21412F;--bad:#FF8F82;--badbg:#4A2622;--acc:#8FB0F0;--accfg:#10203A}}
:root[data-theme="dark"]{--bg:#14201E;--ink:#E7F0EC;--soft:#9DB2AB;--panel:#1D2E2B;--line:#E58B7E;--btn:#2A3F3B;--btnh:#35504A;--ok:#7BD39B;--okbg:#21412F;--bad:#FF8F82;--badbg:#4A2622;--acc:#8FB0F0;--accfg:#10203A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",system-ui,sans-serif;min-height:100%}
main{max-width:34rem;margin:0 auto;padding:1rem 1rem 2rem}
h1{font-size:1.5rem;margin:.2rem 0 .1rem;font-weight:900}
.sub{color:var(--soft);margin:0 0 1rem;font-size:.95rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
select,button{font:inherit;color:var(--ink)}
select{background:var(--btn);border:0;border-radius:.6rem;padding:.5rem .7rem}
.stat{display:flex;justify-content:space-between;color:var(--soft);font-weight:700;margin-bottom:.6rem}
.paper{background:var(--panel);border-radius:.4rem;padding:1.4rem .6rem;text-align:center;border:1px solid var(--line)}
.cells{display:inline-flex;gap:0}
.cell{width:clamp(3rem,15vw,4.6rem);aspect-ratio:1;border:1.5px solid var(--line);margin-left:-1.5px;display:grid;place-items:center;font-size:clamp(2rem,10.5vw,3.3rem);font-weight:700;
background:linear-gradient(var(--line) 0 0) center/1px 100% no-repeat,linear-gradient(var(--line) 0 0) center/100% 1px no-repeat;background-blend-mode:normal}
.cell span{background:var(--panel);padding:0 .08em;line-height:1.1}
.rom{font-size:clamp(2.4rem,13vw,4rem);font-weight:900;letter-spacing:.04em;padding:.6rem 0}
.opts.kana button{font-size:1.7rem;letter-spacing:.06em}
.say{margin-top:.8rem;background:none;border:1.5px solid var(--soft);border-radius:2rem;padding:.3rem .9rem;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:1rem 0}
.opts button,.go{border:0;border-radius:.7rem;background:var(--btn);padding:.95rem .5rem;font-size:1.25rem;font-weight:700;cursor:pointer}
.opts button:hover:not(:disabled){background:var(--btnh)}
.opts button.ok{background:var(--okbg);outline:2.5px solid var(--ok)}
.opts button.bad{background:var(--badbg);outline:2.5px solid var(--bad)}
.opts button:disabled{cursor:default}
.ans{display:flex;gap:.5rem;margin:1rem 0}
.ans input{flex:1;font:inherit;font-size:1.25rem;padding:.8rem;border-radius:.7rem;border:2px solid var(--btn);background:var(--panel);color:var(--ink);min-width:0}
.go{background:var(--acc);color:var(--accfg);padding:.8rem 1.3rem}
.fb{min-height:3.4rem;border-radius:.7rem;padding:.7rem .9rem;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--ink)}
.next{display:block;width:100%;margin-top:.7rem}
.miss{list-style:none;padding:0;margin:1rem 0;text-align:left}
.miss li{padding:.5rem 0;border-bottom:1px solid var(--btn)}
.big{font-size:3rem;font-weight:900;margin:.2rem 0}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>よめるかな？</h1>
<p class="sub">Read the word. Pick or type how it sounds.</p>
<div class="bar">
<select id="set" aria-label="Word set"><option value="all">All words</option><option value="a">Set A (first list)</option><option value="b">Set B (second list)</option></select>
<select id="mode" aria-label="Mode"><option value="choose">See hiragana, pick romaji</option><option value="rev">See romaji, pick hiragana</option><option value="type">Type the romaji</option></select>
<select id="len" aria-label="Rounds"><option>10</option><option>20</option><option>47</option></select>
</div>
<div id="app"></div>
</main>
<script>
const A="とかい|city, metropolitan;おなか|stomach;ほし|star;なか|inside, middle;あつこ|girl's name;くつ|shoes;なおこ|girl's name;おはし|chopsticks;はい|yes;いぬ|dog;ねこ|cat;したしい|close, intimate;てんき|weather;たいせつ|important;せいと|students;とにかく|anyway;にく|meat;ひとつ|one (thing);ほんとう|really;そふ|grandpa;しんせつ|kind;なつ|summer";
const B="でんしゃ|train;だいどころ|kitchen;しゃかい|society;ごはん|cooked rice;べんり|convenient;きっぷ|ticket;やさい|vegetables;りんご|apple;かんぱい|cheers;めがね|glasses;たばこ|cigarettes;ときどき|sometimes;えらい|admirable;どうぶつ|animals;むすめ|daughter;にっき|diary;りょかん|Japanese inn;びょういん|hospital;いしゃ|doctor;じんじゃ|shrine;おてら|temple;おんがく|music;にほんご|Japanese;でんわ|phone;やくざ|gangster";
const parse=(s,set)=>s.split(";").map(x=>{const[k,m]=x.split("|");return{k,m,set}});
const WORDS=[...parse(A,"a"),...parse(B,"b")];
const RM={};"あa いi うu えe おo かka きki くku けke こko さsa しshi すsu せse そso たta ちchi つtsu てte とto なna にni ぬnu ねne のno はha ひhi ふfu へhe ほho まma みmi むmu めme もmo やya ゆyu よyo らra りri るru れre ろro わwa をwo んn がga ぎgi ぐgu げge ごgo ざza じji ずzu ぜze ぞzo だda でde どdo ばba びbi ぶbu べbe ぼbo ぱpa ぴpi ぷpu ぺpe ぽpo".split(" ").forEach(p=>RM[p[0]]=p.slice(1));
const SM={ゃ:"a",ゅ:"u",ょ:"o"};
function romaji(k){let o="",dbl=false;const c=[...k];for(let i=0;i<c.length;i++){let ch=c[i];if(ch==="っ"){dbl=true;continue}let r=RM[ch]||"";if(SM[c[i+1]]){const s=r.slice(0,-1);r=(["sh","ch","j"].includes(s)?s:s+"y")+SM[c[i+1]];i++}if(dbl){r=r[0]+r;dbl=false}o+=r}return o}
const CF={は:"ほけ",ほ:"はま",ぬ:"めね",め:"ぬあ",わ:"れね",れ:"わね",ね:"れぬ",る:"ろら",ろ:"るち",さ:"きち",き:"さま",い:"りこ",り:"いつ",こ:"にこ",に:"こた",た:"なに",な:"たぬ",く:"へし",へ:"くん",お:"あむ",あ:"おぬ",す:"むず",む:"すよ",つ:"しう",し:"つう",ま:"ほも",け:"はに",の:"めぬ",と:"ちこ",ち:"さと",て:"ち",う:"ら",ふ:"ぬ",そ:"て",や:"ゆも",ゆ:"や",ん:"ろ",ご:"こぞ",が:"かぎ",ざ:"さち",じ:"しり",だ:"たな",で:"てち",ど:"とご",べ:"へば",ぱ:"ぽば",ば:"ぱは",ぶ:"ぷふ",ぼ:"ぽほ",び:"ぴひ",ぎ:"きぐ",ぐ:"くぎ",ず:"すぐ",ぜ:"せぞ",ぞ:"そぜ",げ:"けぐ",ひ:"ふと",ら:"ちる",も:"ま",み:"さめ",よ:"はま",ぷ:"ふぶ",ぴ:"ぷひ",ぺ:"へべ",ぽ:"ぱほ",わ:"れ"};
const ALL=Object.keys(RM).filter(x=>"ぷぴぺぽぱ".indexOf(x)<0);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function distractors(k,ans){const out=new Set(),c=[...k];let t=0;while(out.size<3&&t++<200){const d=[...c];const idx=c.map((x,i)=>"ゃゅょっ".includes(x)?-1:i).filter(i=>i>=0);const n=c.length>3&&Math.random()<.3?2:1;for(let j=0;j<n;j++){const i=pick(idx);d[i]=Math.random()<.8&&CF[c[i]]?pick([...CF[c[i]]]):pick(ALL)}const r=romaji(d.join(""));if(r!==ans)out.add(r)}return [...out]}
function kanaD(k){const out=new Set(),c=[...k],o=romaji(k);let t=0;while(out.size<3&&t++<200){const d=[...c];const idx=c.map((x,i)=>"ゃゅょっ".includes(x)?-1:i).filter(i=>i>=0);const n=c.length>3&&Math.random()<.3?2:1;for(let j=0;j<n;j++){const i=pick(idx);d[i]=Math.random()<.8&&CF[c[i]]?pick([...CF[c[i]]]):pick(ALL)}const s=d.join("");if(romaji(s)!==o)out.add(s)}return [...out]}
const norm=s=>s.toLowerCase().replace(/[^a-z]/g,"").replace(/sya/g,"sha").replace(/syu/g,"shu").replace(/syo/g,"sho").replace(/tya/g,"cha").replace(/zya|jya/g,"ja").replace(/(^|[^t])si/g,"$1shi").replace(/ti/g,"chi").replace(/(^|[^t])tu/g,"$1tsu").replace(/hu/g,"fu").replace(/zi/g,"ji").replace(/nn/g,"n");
const $=id=>document.getElementById(id),app=$("app");
let Q,i,score,streak,best,missed,done;
function start(list){const n=Math.min(+$("len").value,list.length);Q=shuf(list).slice(0,n);i=0;score=0;streak=0;best=0;missed=[];show()}
function pool(){const s=$("set").value;return WORDS.filter(w=>s==="all"||w.set===s)}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function show(){if(i>=Q.length)return end();const w=Q[i],ans=romaji(w.k),mode=$("mode").value;done=false;
let h=`<div class="stat"><span>Word ${i+1} of ${Q.length}</span><span>Score ${score} · Streak ${streak}</span></div>
<div class="paper">${mode==="rev"?`<div class="rom">${ans}</div>`:`<div class="cells" aria-label="${w.k}">${[...w.k].map(c=>`<div class="cell"><span>${c}</span></div>`).join("")}</div>`}<div><button class="say" id="say">Hear it</button></div></div>`;
if(mode==="rev"){const o=shuf([w.k,...kanaD(w.k)]);h+=`<div class="opts kana">${o.map(x=>`<button data-r="${x}">${x}</button>`).join("")}</div>`}
else if(mode==="choose"){const o=shuf([ans,...distractors(w.k,ans)]);h+=`<div class="opts">${o.map(x=>`<button data-r="${x}">${x}</button>`).join("")}</div>`}
else h+=`<div class="ans"><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the reading in romaji" aria-label="Your answer"><button class="go" id="chk">Check</button></div>`;
h+=`<div id="fb" class="fb" aria-live="polite"></div>`;app.innerHTML=h;
$("say").onclick=()=>say(w.k);
if(mode!=="type"){const right=mode==="rev"?w.k:ans;app.querySelectorAll(".opts button").forEach(b=>b.onclick=()=>judge(b.dataset.r===right,w,right,b))}
else{const inp=$("in");inp.focus();const go=()=>{if(inp.value.trim())judge(norm(inp.value)===norm(ans),w,ans)};$("chk").onclick=go;inp.onkeydown=e=>{if(e.key==="Enter")go()}}}
function judge(ok,w,ans,btn){if(done)return;done=true;
if(ok){score++;streak++;best=Math.max(best,streak)}else{streak=0;missed.push(w)}
app.querySelectorAll(".opts button").forEach(b=>{b.disabled=true;if(b.dataset.r===ans)b.classList.add("ok");else if(b===btn)b.classList.add("bad")});
const inp=$("in");if(inp)inp.disabled=true,$("chk").disabled=true;
const f=$("fb");f.className="fb "+(ok?"ok":"bad");
f.innerHTML=`${ok?"Correct!":"Not quite. It reads"} ${w.k} = ${romaji(w.k)}<small>Meaning: ${w.m}</small><button class="go next" id="nx">${i+1<Q.length?"Next word":"See results"}</button>`;
$("nx").focus();$("nx").onclick=()=>{i++;show()}}
function end(){const pct=Math.round(score/Q.length*100);
app.innerHTML=`<div class="paper"><div class="big">${score} / ${Q.length}</div><p>${pct}% correct · best streak ${best}</p>
${missed.length?`<p><b>Words to review</b></p><ul class="miss">${missed.map(w=>`<li><b>${w.k}</b> = ${romaji(w.k)} <span style="color:var(--soft)">(${w.m})</span></li>`).join("")}</ul>`:`<p>Perfect round. Every word read correctly!</p>`}
</div><div class="opts">${missed.length?`<button id="again2">Practise missed</button>`:""}<button id="again">New round</button></div>`;
$("again").onclick=()=>start(pool());const m=$("again2");if(m)m.onclick=()=>start(missed.slice())}
["set","mode","len"].forEach(id=>$(id).onchange=()=>start(pool()));
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const n=+e.key;if(n>=1&&n<=4&&!done){const b=app.querySelectorAll(".opts button")[n-1];if(b&&!b.disabled)b.click()}});
start(pool());
</script>
</body>
</html>
